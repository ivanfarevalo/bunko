name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  unit:
    name: Unit tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.8", "3.10", "3.12", "3.13"]
        exclude:
          - os: macos-latest
            python: "3.8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Optional tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y ffmpeg ripgrep; else brew install ffmpeg ripgrep; fi
      - run: python -m unittest discover -s tests -v
      - name: Build the zipapp and smoke-test it
        run: |
          python scripts/build_pyz.py
          python dist/shelf.pyz --version

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg ripgrep
      - run: pip install playwright && playwright install --with-deps chrome
      - run: python tests/make_demo.py "$RUNNER_TEMP/demo"
      - run: python tests/e2e.py "$RUNNER_TEMP/demo" "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
