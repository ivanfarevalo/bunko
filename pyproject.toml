[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bunko"
dynamic = ["version"]
description = "A read-only file server that renders Markdown, HTML, tables, Office files, images, and video in the browser"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "bunko/static/vendor/LICENSES/*"]
authors = [{ name = "Ivan Arevalo" }]
requires-python = ">=3.8"
dependencies = []
keywords = ["http.server", "file server", "file browser", "markdown", "viewer", "tailscale"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Filesystems",
]

[dependency-groups]
# Tools for working on bunko. The package itself has no dependencies.
dev = [
    "ruff==0.17.6; python_version >= '3.10'",
    "pre-commit==4.6.2; python_version >= '3.10'",
    "playwright>=1.48; python_version >= '3.10'",
]

[project.urls]
Homepage = "https://github.com/ivanfarevalo/bunko"
Documentation = "https://github.com/ivanfarevalo/bunko/tree/main/docs"
Issues = "https://github.com/ivanfarevalo/bunko/issues"
Changelog = "https://github.com/ivanfarevalo/bunko/blob/main/CHANGELOG.md"

[project.scripts]
bunko = "bunko.cli:main"

[tool.setuptools.packages.find]
include = ["bunko*"]

[tool.setuptools.dynamic]
version = { attr = "bunko.__version__" }

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js", "*.txt", "*.md"]

[tool.ruff]
line-length = 100
target-version = "py38"
extend-exclude = ["bunko/static"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "B",        # bugbear
    "UP",       # pyupgrade, to the oldest supported Python
    "SIM",      # simplifications
    "C4",       # comprehensions
    "PIE",
    "RET",      # return statements
    "RUF",
]
ignore = [
    "E501",     # the formatter decides line breaks; long strings stay whole
]
allowed-confusables = ["×"]  # the multiplication sign in image dimensions

[tool.ruff.lint.isort]
known-first-party = ["bunko"]
